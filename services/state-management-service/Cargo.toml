[package]
name = "state-management-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
shared = { path = "../../shared" }

# Database dependencies (optional)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"], optional = true }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }

# CRDT dependencies - implementing our own simple CRDTs
# crdt = "0.5"
serde_cbor = "0.11"
bincode = "1.3"

# Async traits
async-trait = "0.1"

# Compression
lz4_flex = "0.11"

[features]
default = []
database = ["sqlx", "redis"]

[dev-dependencies]
proptest = "1.0"
tokio-test = "0.4"