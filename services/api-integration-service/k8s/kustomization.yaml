apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sanad

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: api-integration-service
  app.kubernetes.io/part-of: sanad
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  documentation: "https://github.com/sanad/api-integration-service"

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - redis-deployment.yaml
  - postgres-deployment.yaml
  - servicemonitor.yaml

# Images to use
images:
  - name: sanad/api-integration-service
    newTag: latest

# ConfigMap generator (alternative to configmap.yaml)
# configMapGenerator:
#   - name: api-integration-config
#     files:
#       - config/api_integration_config.yaml

# Secret generator (alternative to secret.yaml)
# secretGenerator:
#   - name: api-integration-secrets
#     envs:
#       - .env.production

# Patches for different environments
patchesStrategicMerge: []

# JSON patches
patches: []

# Replicas (can be overridden per environment)
replicas:
  - name: api-integration-service
    count: 3

# Resource limits (can be overridden per environment)
# patches:
#   - target:
#       kind: Deployment
#       name: api-integration-service
#     patch: |-
#       - op: replace
#         path: /spec/template/spec/containers/0/resources/limits/memory
#         value: 1Gi
