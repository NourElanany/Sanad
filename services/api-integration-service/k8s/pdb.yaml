apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-integration-service
  namespace: sanad
  labels:
    app: api-integration-service
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-integration-service
  unhealthyPodEvictionPolicy: IfHealthyBudget
