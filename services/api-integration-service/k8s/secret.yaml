apiVersion: v1
kind: Secret
metadata:
  name: api-integration-secrets
  namespace: sanad
  labels:
    app: api-integration-service
    component: secrets
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "changeme_in_production"
  
  # API Keys - REPLACE THESE WITH ACTUAL KEYS IN PRODUCTION
  # Use kubectl create secret or external secrets management
  QURAN_COM_API_KEY: "your_quran_com_api_key_here"
  SUNNAH_COM_API_KEY: "your_sunnah_com_api_key_here"
  ISLAMIC_FINDER_API_KEY: "your_islamic_finder_api_key_here"
  HUGGING_FACE_API_KEY: "your_hugging_face_api_key_here"
  OPENAI_API_KEY: ""  # Optional
---
# Example of creating secrets from command line (recommended for production):
# kubectl create secret generic api-integration-secrets \
#   --from-literal=POSTGRES_PASSWORD='your_secure_password' \
#   --from-literal=QURAN_COM_API_KEY='your_actual_key' \
#   --from-literal=SUNNAH_COM_API_KEY='your_actual_key' \
#   --from-literal=ISLAMIC_FINDER_API_KEY='your_actual_key' \
#   --from-literal=HUGGING_FACE_API_KEY='your_actual_key' \
#   --namespace=sanad
#
# Or use external secrets management like:
# - Sealed Secrets
# - External Secrets Operator
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
