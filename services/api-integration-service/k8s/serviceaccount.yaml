apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-integration-service
  namespace: sanad
  labels:
    app: api-integration-service
    component: backend
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-integration-service
  namespace: sanad
  labels:
    app: api-integration-service
rules:
  # Allow reading ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading own pod information
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-integration-service
  namespace: sanad
  labels:
    app: api-integration-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-integration-service
subjects:
  - kind: ServiceAccount
    name: api-integration-service
    namespace: sanad
