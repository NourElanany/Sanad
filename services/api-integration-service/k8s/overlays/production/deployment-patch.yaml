apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-integration-service
spec:
  template:
    spec:
      containers:
        - name: api-integration-service
          # Production resource limits
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          # Production logging level
          env:
            - name: RUST_LOG
              value: info
          # Stricter security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
