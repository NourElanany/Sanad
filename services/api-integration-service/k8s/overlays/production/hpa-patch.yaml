apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-integration-service
spec:
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # More aggressive scaling in production
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
