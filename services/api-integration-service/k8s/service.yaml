apiVersion: v1
kind: Service
metadata:
  name: api-integration-service
  namespace: sanad
  labels:
    app: api-integration-service
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: api-integration-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: None
---
# Headless service for StatefulSet (if needed for direct pod access)
apiVersion: v1
kind: Service
metadata:
  name: api-integration-service-headless
  namespace: sanad
  labels:
    app: api-integration-service
    component: backend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: api-integration-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
