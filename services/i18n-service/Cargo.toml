[package]
name = "i18n-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework and async runtime
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database and ORM
sqlx = { workspace = true }
redis = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
config = { workspace = true }

# UUID and time
uuid = { workspace = true }
chrono = { workspace = true }

# Shared models
shared = { path = "../../shared" }

# Regular expressions
regex = "1.10"

# Collections
indexmap = "2.0"

# Testing
proptest = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"