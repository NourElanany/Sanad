version: '3.8'

services:
  # PostgreSQL database for main data
  postgres:
    image: postgres:15-alpine
    container_name: sanad-postgres
    environment:
      POSTGRES_DB: sanad
      POSTGRES_USER: sanad_user
      POSTGRES_PASSWORD: sanad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - sanad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanad_user -d sanad"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cluster for high-performance caching
  redis-node-1:
    image: redis:7-alpine
    container_name: sanad-redis-node-1
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis_node_1_data:/data
    networks:
      - sanad-network
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-node-2:
    image: redis:7-alpine
    container_name: sanad-redis-node-2
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis_node_2_data:/data
    networks:
      - sanad-network
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-node-3:
    image: redis:7-alpine
    container_name: sanad-redis-node-3
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis_node_3_data:/data
    networks:
      - sanad-network
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes-7003.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cluster Setup Service
  redis-cluster-setup:
    image: redis:7-alpine
    container_name: sanad-redis-cluster-setup
    networks:
      - sanad-network
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for Redis nodes to be ready...' &&
        sleep 10 &&
        echo 'Creating Redis cluster...' &&
        redis-cli --cluster create
        redis-node-1:7001
        redis-node-2:7002
        redis-node-3:7003
        --cluster-replicas 0 --cluster-yes &&
        echo 'Redis cluster created successfully!'
      "
    restart: "no"

  # Redis for backward compatibility and simple operations
  redis:
    image: redis:7-alpine
    container_name: sanad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sanad-network
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: sanad-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sanad-network
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: sanad-gateway
    ports:
      - "8080:8080"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_QDRANT_URL: http://qdrant:6333
      SANAD_SECURITY_JWT_SECRET: your-super-secret-jwt-key-change-in-production
      SANAD_EXTERNAL_APIS_HUGGING_FACE_API_KEY: ${HUGGING_FACE_API_KEY}
      SANAD_EXTERNAL_APIS_GEO_LOCATION_API_KEY: ${GEO_LOCATION_API_KEY}
      SANAD_LOGGING_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Quran Service
  quran-service:
    build:
      context: .
      dockerfile: services/quran-service/Dockerfile
    container_name: sanad-quran-service
    ports:
      - "8081:8081"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Hadith Service
  hadith-service:
    build:
      context: .
      dockerfile: services/hadith-service/Dockerfile
    container_name: sanad-hadith-service
    ports:
      - "8082:8082"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Stories Service
  stories-service:
    build:
      context: .
      dockerfile: services/stories-service/Dockerfile
    container_name: sanad-stories-service
    ports:
      - "8083:8083"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Prayer Times Service
  prayer-times-service:
    build:
      context: .
      dockerfile: services/prayer-times-service/Dockerfile
    container_name: sanad-prayer-times-service
    ports:
      - "8084:8084"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8084
      SANAD_EXTERNAL_APIS_GEO_LOCATION_API_KEY: ${GEO_LOCATION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Calendar Service
  calendar-service:
    build:
      context: .
      dockerfile: services/calendar-service/Dockerfile
    container_name: sanad-calendar-service
    ports:
      - "8085:8085"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: sanad-ai-service
    ports:
      - "8086:8086"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_QDRANT_URL: http://qdrant:6333
      SANAD_SERVER_PORT: 8086
      SANAD_EXTERNAL_APIS_HUGGING_FACE_API_KEY: ${HUGGING_FACE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Search Service
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: sanad-search-service
    ports:
      - "8087:8087"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_QDRANT_URL: http://qdrant:6333
      SANAD_SERVER_PORT: 8087
      SANAD_EXTERNAL_APIS_EMBEDDING_SERVICE_API_KEY: ${EMBEDDING_SERVICE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Audio Analysis Service
  audio-analysis-service:
    build:
      context: .
      dockerfile: services/audio-analysis-service/Dockerfile
    container_name: sanad-audio-analysis-service
    ports:
      - "8088:8088"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8088
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Khatma Service
  khatma-service:
    build:
      context: .
      dockerfile: services/khatma-service/Dockerfile
    container_name: sanad-khatma-service
    ports:
      - "8089:8089"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8089
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

  # Cache Service
  cache-service:
    build:
      context: .
      dockerfile: services/cache-service/Dockerfile
    container_name: sanad-cache-service
    ports:
      - "8091:8091"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_REDIS_CLUSTER_ENABLED: true
      SANAD_REDIS_CLUSTER_NODES: "redis://redis-node-1:7001,redis://redis-node-2:7002,redis://redis-node-3:7003"
      SANAD_SERVER_PORT: 8091
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cluster-setup:
        condition: service_completed_successfully
    networks:
      - sanad-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: sanad-notification-service
    ports:
      - "8090:8090"
    environment:
      SANAD_DATABASE_URL: postgresql://sanad_user:sanad_password@postgres:5432/sanad
      SANAD_REDIS_URL: redis://redis:6379
      SANAD_SERVER_PORT: 8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sanad-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_node_1_data:
    driver: local
  redis_node_2_data:
    driver: local
  redis_node_3_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  sanad-network:
    driver: bridge