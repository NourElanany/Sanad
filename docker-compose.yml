version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sanad-postgres
    environment:
      POSTGRES_DB: sanad
      POSTGRES_USER: sanad_user
      POSTGRES_PASSWORD: sanad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/sql:/docker-entrypoint-initdb.d
    networks:
      - sanad-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sanad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - sanad-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sanad-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - sanad-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: sanad-api-gateway
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://sanad_user:sanad_password@postgres:5432/sanad
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - sanad-network

  # Quran Service
  quran-service:
    build:
      context: .
      dockerfile: services/quran-service/Dockerfile
    container_name: sanad-quran-service
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://sanad_user:sanad_password@postgres:5432/sanad
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - sanad-network

  # Hadith Service
  hadith-service:
    build:
      context: .
      dockerfile: services/hadith-service/Dockerfile
    container_name: sanad-hadith-service
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql://sanad_user:sanad_password@postgres:5432/sanad
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - sanad-network

  # AI Service
  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: sanad-ai-service
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgresql://sanad_user:sanad_password@postgres:5432/sanad
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - sanad-network

  # Search Service
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: sanad-search-service
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=postgresql://sanad_user:sanad_password@postgres:5432/sanad
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - sanad-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  sanad-network:
    driver: bridge