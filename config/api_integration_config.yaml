# API Integration Service Configuration

service:
  name: api-integration-service
  port: 8080
  host: 0.0.0.0

redis:
  url: redis://localhost:6379
  pool_size: 10
  connection_timeout: 5s

postgres:
  url: postgresql://user:pass@localhost:5432/sanad
  pool_size: 20
  connection_timeout: 10s

# API Configurations
# Each API has: name, base_url, priority (1=primary, 2=secondary, etc.), 
# requires_key (optional), rate_limit, and timeout
apis:
  quran:
    - name: quran.com
      base_url: https://api.quran.com/api/v4
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 10s
      
    - name: alquran.cloud
      base_url: https://api.alquran.cloud/v1
      priority: 2
      requires_key: false
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 10s
      
    - name: tanzil
      base_url: https://api.tanzil.net
      priority: 3
      requires_key: false
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 10s
      
    - name: everyayah
      base_url: https://everyayah.com
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 15s
      
  hadith:
    - name: sunnah.com
      base_url: https://api.sunnah.com/v1
      priority: 1
      requires_key: true
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 15s
      
    - name: islamhouse
      base_url: https://api.islamhouse.com
      priority: 2
      requires_key: false
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 15s
      
  prayer_times:
    - name: aladhan
      base_url: https://api.aladhan.com/v1
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 5s
      
    - name: islamic_finder
      base_url: https://api.islamicfinder.org
      priority: 2
      requires_key: true
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 5s
      
  tafsir:
    - name: quran.com
      base_url: https://api.quran.com/api/v4
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 10s
      
  calendar:
    - name: aladhan
      base_url: https://api.aladhan.com/v1
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 5s
      
    - name: islamic_finder
      base_url: https://api.islamicfinder.org
      priority: 2
      requires_key: true
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 5s
      
  qibla:
    - name: aladhan
      base_url: https://api.aladhan.com/v1
      priority: 1
      requires_key: false
      rate_limit:
        per_minute: 60
        per_hour: 1000
        per_day: 10000
      timeout: 5s
      
    - name: islamic_finder
      base_url: https://api.islamicfinder.org
      priority: 2
      requires_key: true
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 5s
      
  ai:
    - name: huggingface
      base_url: https://api-inference.huggingface.co
      priority: 1
      requires_key: true
      rate_limit:
        per_minute: 30
        per_hour: 500
        per_day: 5000
      timeout: 30s

# Cache Strategies
# Each data type has: ttl (time to live), allow_stale (use expired cache as fallback),
# and stale_ttl (how long to keep stale cache)
cache:
  strategies:
    quran_text:
      ttl: 30d
      allow_stale: true
      stale_ttl: 90d
      
    hadith:
      ttl: 30d
      allow_stale: true
      stale_ttl: 90d
      
    prayer_times:
      ttl: 1d
      allow_stale: true
      stale_ttl: 7d
      
    tafsir:
      ttl: 30d
      allow_stale: true
      stale_ttl: 90d
      
    calendar:
      ttl: 7d
      allow_stale: true
      stale_ttl: 30d
      
    qibla:
      ttl: 30d
      allow_stale: true
      stale_ttl: 90d
      
    ai_response:
      ttl: 1h
      allow_stale: false

# Health Monitor Configuration
health_monitor:
  check_interval: 5m
  unhealthy_threshold: 3  # consecutive failures before marking unhealthy
  recovery_threshold: 2   # consecutive successes before marking healthy

# Retry Configuration
retry:
  max_attempts: 3
  initial_delay: 1s
  max_delay: 10s
  multiplier: 2.0  # exponential backoff multiplier
